server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Redirects (adding a trailing slash) must stay relative: the published port is not the one nginx listens on.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # add_header in a location replaces the server-level ones, so they are repeated here.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # nginx has no type for Markdown; without this DESIGN.md downloads instead of opening.
    location ~ \.md$ {
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
